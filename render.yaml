services:
  - type: web
    name: stockfolio
    runtime: python
    plan: starter
    buildCommand: "python3 --version"
    startCommand: "python3 server.py"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: ARENA_DB_PATH
        value: /var/data/stockfolio_arenas.db
    disk:
      name: stockfolio-data
      mountPath: /var/data
      sizeGB: 1
